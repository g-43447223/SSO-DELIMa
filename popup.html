<!DOCTYPE html>
<html lang="ms" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Smart SSO Gateway</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { width: 420px; min-height: 520px; margin: 0; }
    .glass-card {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans p-4 select-none">

  <!-- Header -->
  <header class="flex items-center justify-between pb-4 mb-4 border-b border-slate-800">
    <div class="flex items-center gap-2.5">
      <img src="logo.png" alt="Logo" class="w-8 h-8 object-contain">
      <div>
        <h1 class="font-bold text-sm text-blue-400 leading-none">SMART SSO GATEWAY</h1>
        <p class="text-[10px] text-slate-400 mt-0.5">SK Pulau Indah</p>
      </div>
    </div>
    <button id="themeToggle" class="p-2 rounded-full bg-slate-800 border border-slate-700 hover:bg-slate-700 transition">
      <i id="themeIcon" data-lucide="moon" class="w-4 h-4 text-amber-400"></i>
    </button>
  </header>

  <!-- Borang Utama -->
  <main class="space-y-3">
    <div>
      <label for="tahun" class="block text-[11px] font-bold uppercase tracking-wider text-slate-300 mb-1">1. Pilih Tahun / Tingkatan:</label>
      <select id="tahun" class="w-full px-3 py-2 rounded-lg border border-slate-700 bg-slate-900 text-slate-100 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
        <option value="">⌛ Sedang memuatkan data murid...</option>
      </select>
    </div>

    <div>
      <label for="kelas" class="block text-[11px] font-bold uppercase tracking-wider text-slate-300 mb-1">2. Pilih Kelas:</label>
      <select id="kelas" disabled class="w-full px-3 py-2 rounded-lg border border-slate-700 bg-slate-900 text-slate-100 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none disabled:opacity-50">
        <option value="">-- Sila Pilih Tahun Terlebih Dahulu --</option>
      </select>
    </div>

    <div>
      <label for="murid" class="block text-[11px] font-bold uppercase tracking-wider text-slate-300 mb-1">3. Pilih Nama Murid:</label>
      <select id="murid" disabled class="w-full px-3 py-2 rounded-lg border border-slate-700 bg-slate-900 text-slate-100 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none disabled:opacity-50">
        <option value="">-- Sila Pilih Kelas Terlebih Dahulu --</option>
      </select>
    </div>

    <button id="btnLogin" disabled class="w-full mt-4 py-3 px-4 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-800 text-white font-bold text-xs rounded-xl shadow-lg flex items-center justify-center gap-2 transition disabled:cursor-not-allowed">
      <i data-lucide="key" class="w-4 h-4"></i>
      <span>LOG MASUK DELIMA 3.0</span>
    </button>
  </main>

  <!-- Footer -->
  <footer class="mt-5 pt-3 border-t border-slate-800 text-center text-[10px] text-slate-500">
    <p>SK Pulau Indah | Sir Fahmi Rahim</p>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
